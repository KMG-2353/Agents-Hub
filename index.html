<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agents Hub</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f0f;
      --surface: #1a1a1a;
      --border: #2a2a2a;
      --text: #e8e8e8;
      --muted: #888;
      --accent: #fff;
      --live: #3ecf8e;
      --hover-bg: #222;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      min-height: 100vh;
      padding: 48px 24px;
    }

    header {
      max-width: 800px;
      margin: 0 auto 48px;
    }

    header h1 {
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--accent);
    }

    header p {
      margin-top: 8px;
      font-size: 0.875rem;
      color: var(--muted);
    }

    .divider {
      max-width: 800px;
      margin: 0 auto 32px;
      border: none;
      border-top: 1px solid var(--border);
    }

    #filters {
      max-width: 800px;
      margin: 0 auto 24px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .filter-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 4px 12px;
      border-radius: 4px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.15s;
    }

    .filter-btn:hover,
    .filter-btn.active {
      border-color: var(--accent);
      color: var(--accent);
    }

    #grid {
      max-width: 800px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 16px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: border-color 0.15s, background 0.15s;
    }

    .card:hover {
      border-color: #444;
      background: var(--hover-bg);
    }

    .card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .card-name {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--accent);
    }

    .badge {
      font-size: 0.7rem;
      padding: 2px 8px;
      border-radius: 12px;
      border: 1px solid;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .badge-live {
      color: var(--live);
      border-color: rgba(62, 207, 142, 0.3);
      background: rgba(62, 207, 142, 0.08);
    }

    .badge-beta {
      color: #facc15;
      border-color: rgba(250, 204, 21, 0.3);
      background: rgba(250, 204, 21, 0.08);
    }

    .badge-wip {
      color: var(--muted);
      border-color: var(--border);
    }

    .card-desc {
      font-size: 0.825rem;
      color: var(--muted);
      line-height: 1.5;
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: auto;
    }

    .tag {
      font-size: 0.7rem;
      color: var(--muted);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 2px 6px;
    }

    .arrow {
      color: var(--muted);
      font-size: 0.875rem;
      transition: transform 0.15s, color 0.15s;
    }

    .card:hover .arrow {
      transform: translateX(3px);
      color: var(--accent);
    }

    #empty {
      max-width: 800px;
      margin: 48px auto;
      text-align: center;
      color: var(--muted);
      font-size: 0.875rem;
      display: none;
    }

    footer {
      max-width: 800px;
      margin: 64px auto 0;
      font-size: 0.75rem;
      color: #444;
      text-align: center;
    }
  </style>
</head>
<body>

  <header>
    <h1>Agents Hub</h1>
    <p>A collection of AI agents. Click any card to open the agent.</p>
  </header>

  <hr class="divider" />

  <div id="filters"></div>
  <div id="grid"></div>
  <div id="empty">No agents found.</div>

  <footer>agents.json &mdash; add an entry to register a new agent</footer>

  <script>
    async function load() {
      const res = await fetch('agents.json');
      const agents = await res.json();

      const categories = ['All', ...new Set(agents.map(a => a.category))];
      let active = 'All';

      const filtersEl = document.getElementById('filters');
      const gridEl = document.getElementById('grid');
      const emptyEl = document.getElementById('empty');

      function render(filter) {
        const list = filter === 'All' ? agents : agents.filter(a => a.category === filter);
        gridEl.innerHTML = '';
        emptyEl.style.display = list.length === 0 ? 'block' : 'none';
        list.forEach(agent => {
          const card = document.createElement('a');
          card.className = 'card';
          card.href = agent.url;
          card.target = '_blank';
          card.rel = 'noopener noreferrer';

          const statusClass = {
            live: 'badge-live',
            beta: 'badge-beta',
            wip: 'badge-wip',
          }[agent.status] || 'badge-wip';

          card.innerHTML = `
            <div class="card-header">
              <span class="card-name">${agent.name}</span>
              <span class="badge ${statusClass}">${agent.status}</span>
            </div>
            <p class="card-desc">${agent.description}</p>
            <div class="card-footer">
              <span class="tag">${agent.category}</span>
              <span class="arrow">→</span>
            </div>
          `;
          gridEl.appendChild(card);
        });
      }

      categories.forEach(cat => {
        const btn = document.createElement('button');
        btn.className = 'filter-btn' + (cat === 'All' ? ' active' : '');
        btn.textContent = cat;
        btn.addEventListener('click', () => {
          active = cat;
          filtersEl.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          render(active);
        });
        filtersEl.appendChild(btn);
      });

      render('All');
    }

    load();
  </script>
</body>
</html>
